[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membench"
version = "0.1.0"
description = "Agentic Memory Evaluation Harness — Spec Phase-1 skeleton (Harbor 3-condition substrate)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "toml>=0.10",
]

# Harbor (harbor-framework/harbor, Apache-2.0) is the execution substrate for real
# `harbor run` invocations. The skeleton + its tests do NOT require Harbor at import
# time — task dirs are emitted in Harbor's real format and validated against
# harbor.TaskConfig only when the package is present (see tests/test_harbor_adapter.py).
[project.optional-dependencies]
harbor = ["harbor>=0.3"]
# pyyaml: test_python_gates_are_opt_out.py reads the gate commands out of
# .github/workflows/ci.yml so it probes what CI actually runs. It is present
# transitively today (harbor, pre-commit), but a guard that silently SKIPS when
# an undeclared dep is absent is the precise failure this repo's gates exist to
# prevent — so it is declared.
# jsonschema: the BDP fixture gate validates every emitted record against the
# vendored bdp-v0 bundle. Same reasoning as pyyaml above - it arrives
# transitively today (harbor, mcp), and a validation gate that SKIPS when its
# validator is missing reports green for fixtures nobody checked.
# mypy floor is 1.14, not 1.11: [tool.mypy]'s jsonschema override uses the
# per-module `follow_untyped_imports`, which mypy added in 1.14. An older mypy
# cannot honour it, so the public validator's jsonschema import would red the
# gate the override exists to resolve.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.14", "black>=24.0", "types-toml>=0.10", "pyyaml>=6.0", "matplotlib>=3.8", "jsonschema>=4.20"]

[project.scripts]
membench = "membench.cli:main"

[tool.setuptools.packages.find]
include = ["membench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# black is the sole formatter (also invoked by the editor's black-on-save hook,
# which reads this block) — ruff lints but does NOT format, so the two never fight.
[tool.black]
line-length = 100
target-version = ["py311"]
# Immutable experiment evidence includes historical source snapshots; formatting
# changes their pinned bytes. Graders retain their own explicit quality gates.
extend-exclude = "/results/"

[tool.ruff]
line-length = 100
target-version = "py311"
# Historical diagnostic scripts and grader snapshots are immutable evidence,
# not maintained package source. Qualified graders are checked explicitly.
extend-exclude = ["results"]

[tool.ruff.lint]
# PEP8 (E) + pyflakes (F) + isort (I) + pyupgrade (UP) + bugbear (B) +
# simplify (SIM) + comprehensions (C4) + ruff (RUF) + pep8-naming (N).
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
# OpenTelemetry ships no type information for some call sites (e.g. 1.42's
# ReadableSpan.get_span_context); allow untyped calls INTO it — callee-based, so
# strictness for our own code is not relaxed. The per-module override below can't
# express this: per-module disallow_untyped_calls governs calls made FROM the
# matched modules, not calls into them.
untyped_calls_exclude = ["opentelemetry"]

# Coverage is opt-OUT, not opt-in (mem-sspvk): crawl everything, then name what
# is excluded and why. The prior gate hand-listed its targets on the CI command
# line, so a newly added directory was uncovered by default and silently — which
# is exactly how conftest.py and examples/ went unchecked. Each exclusion below
# must carry a reason; an unreasoned one is a bug, not a config entry.
# `exclude` filters the recursive crawl only, not explicitly-named FILES —
# sound here precisely because both entries below are DIRECTORIES, hence crawls.
# (A named directory is still crawled, so `mypy scripts` reports "no .py[i]
# files"; a named file is not, so `mypy scripts/x.py` checks it. Spot-check an
# excluded tree by file.)
#
# `../public` is a second crawl root, not an enumerated target: it is a SIBLING
# of this package, so "." never reaches it, and the published release's
# standalone validator (public/validator/membench_validate.py) sat outside this
# gate — and outside ruff and black — until it was named here. Naming the
# directory keeps the opt-out property inside it: a new .py file under public/ is
# covered without another edit. ruff and black cannot be fixed this way, because
# their targets are argv, not config; see the gate sites in .github/workflows/
# ci.yml and .pre-commit-config.yaml, pinned by tests/test_public_tree_is_gated.py.
#
# The regexes are anchored relative to the INVOCATION cwd, not to this file, so
# they hold only because both gate sites run from memory-bench/ (ci.yml's
# `working-directory:`, and pre-commit's `cd memory-bench`).
#
# Crawl constraint: `examples/` subdirectories are not Python packages (their
# names are hyphenated, so they cannot be), which makes each example script a
# TOP-LEVEL module named after its file. Two examples sharing a basename
# therefore collide ("Duplicate module named 'smoke'") and mypy ABORTS the whole
# run rather than checking anything. Adding a second example named like the
# first is the trigger; the failure is loud and mypy names the fixes. Tracked in
# mem-1ql4w — the durable fix is package-legal example directories.
files = [".", "../public"]
exclude = [
    # Immutable experiment evidence contains independent historical modules with
    # duplicate names. Each qualified grader has explicit strict checks; crawling
    # snapshots together cannot assign them a single Python module identity.
    "^results/",
    # Vendored.
    "^\\.venv/",
    # Never been typed: thousands of errors under --strict. Typing it is its own
    # body of work, not a side effect of this gate change. (No count here on
    # purpose — it moves with every test added, so it would be born stale.)
    "^tests/",
    # In-flight deliverable of mem-cv06b (branch work/mem-cv06b, unmerged): the
    # scripts/ mypy-annotation sweep. (No count here, for the reason above — it
    # moves as that sweep lands annotations.) Excluding it is not a regression —
    # the gate this replaces (`mypy --strict membench`) did not cover scripts/
    # either. mem-cv06b deletes this entry when its sweep lands.
    "^scripts/",
]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# Competitive arms lazily import optional memory SDKs that ship no type stubs and
# need not be installed for the suite to load; silence import-not-found uniformly.
[[tool.mypy.overrides]]
module = [
    "mem0",
    "mem0.*",
    "agentic_memory",
    "agentic_memory.*",
    "nat.*",
    "graphiti_core",
    "graphiti_core.*",
    "data_designer",
    "data_designer.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

# Harbor (the eval framework) is an optional dep, lazily imported inside the exec
# path and shipping no stubs; ignore-missing keeps the type gate green whether or
# not it's installed (it is required at RUNTIME, validated where it is imported).
[[tool.mypy.overrides]]
module = ["harbor.*"]
ignore_missing_imports = true

# jsonschema is the one third-party import of the standalone public validator
# (../public/validator/membench_validate.py), now inside the crawl. Typeshed KNOWS
# the package, so an absent stub package is `import-untyped`, which
# `ignore_missing_imports` does not silence (verified: it only covers
# `import-not-found`). Declaring `types-jsonschema` was rejected because the local
# gate site runs against the ambient interpreter (pre-commit `language: system`),
# which on a PEP-668 machine cannot install it — the gate would be red for a
# missing checker-only package. Following the installed package instead keeps one
# mechanism and works whether or not stubs are present.
[[tool.mypy.overrides]]
module = ["jsonschema"]
follow_untyped_imports = true
