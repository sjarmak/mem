name: CI

# Code-quality gate for both languages (mem-5r1). Python: ruff (broad select) +
# black --check + mypy --strict + pytest. TypeScript: tsc --noEmit + eslint
# (type-checked) + prettier --check + vitest, via `npm run check`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (ruff + black + mypy --strict + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memory-bench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Repo-root-relative: `defaults.run.working-directory` scopes to `run`
          # steps, never to `uses` inputs. Pinned, not left to the action's
          # `**/pyproject.toml` backup glob (tests/test_ci_pip_cache.py).
          cache-dependency-path: memory-bench/pyproject.toml
      - run: pip install -e ".[dev]"
      # Whole-tree by default (mem-sspvk) — a new directory is covered without
      # anyone remembering to add it here. mypy's target set and its reasoned
      # exclusions live in pyproject's [tool.mypy] (which sets strict = true).
      #
      # `../public` is named because it is a SIBLING of the crawl root, so "whole
      # tree" does not reach it: the published release ships a standalone
      # validator (public/validator/membench_validate.py) that was outside all
      # three gates and failed all three. The named target is the DIRECTORY, so a
      # new .py file anywhere under public/ is still covered without an edit here.
      #
      # `--config` is load-bearing for black and kept on ruff for symmetry. Both
      # tools resolve configuration from the files they are handed, and public/
      # has no pyproject.toml above it before the git root — so a bare
      # `black --check . ../public` silently formats the validator at black's
      # DEFAULT 88 columns while this repo's rule is 100, and reports a diff that
      # no in-repo configuration can satisfy.
      - run: ruff check --config pyproject.toml . ../public
      - run: black --check --config pyproject.toml . ../public
      - run: mypy
      - run: pytest -q

  typescript:
    name: typescript (tsc + eslint + prettier + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run review:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-review-browser-failure
          path: .architecture-review-tests/
          include-hidden-files: true
