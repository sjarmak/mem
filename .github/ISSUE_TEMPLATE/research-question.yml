name: Research question
description: Frame a community or engineering signal as a falsifiable, decision-relevant question.
title: '[Research]: '
labels: ['research-question']
body:
  - type: markdown
    attributes:
      value: |
        You do not have to be a researcher to file this. Answer the first four boxes in your own words and stop there. Everything below them is optional, and maintainers fill in what you leave blank when the question is registered as an experiment.
  - type: textarea
    id: decision
    attributes:
      label: What decision would the answer change?
      description: What would we do differently depending on how this comes out?
      placeholder: If memory costs more time than it saves, pause the rollout until the cost is fixed.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question, stated so that the answer could be no
      description: What you expect to be true, and what result would prove you wrong. Comparing two things ("with memory" against "without") is what makes it answerable.
      placeholder: An agent with memory finishes the same task in less wall-clock time than an agent without it.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: How would you test it?
      description: A sketch is enough. What to run, what to measure, what to compare it against.
    validations:
      required: true
  - type: dropdown
    id: task_source
    attributes:
      label: What should it run on?
      description: Pick Unknown if you have no preference.
      options: [Sanitized real, Authored operational, Synthetic stress, Replay, Mixed, Unknown]
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Optional from here down

        These are the fields we have to settle before a run can be trusted. Fill in any you have an opinion about; leave the rest blank and we will complete them at registration and post what we chose.
  - type: textarea
    id: signals
    attributes:
      label: What prompted this?
      description: Link any issue, discussion, or run that made you ask, and say whether it overlaps something already filed. A hunch is a valid answer. Do not paste private reports.
  - type: textarea
    id: gates
    attributes:
      label: How big an effect would be worth having?
      description: The smallest improvement that would change the decision, and how much of a regression elsewhere, or extra cost, would be too much to accept for it.
  - type: textarea
    id: contamination
    attributes:
      label: Ways the result could be misleading
      description: Anything that could let the agent see the answer in advance, or make the numbers look good for a reason other than the one being tested.
  - type: textarea
    id: precision
    attributes:
      label: How many runs would it take to settle?
      description: Whether one run could answer this or it needs repeats to separate a real effect from noise, and what we should publish if it comes out inconclusive.
  - type: textarea
    id: provenance
    attributes:
      label: What has to be pinned to reproduce it?
      description: Versions, corpora, configurations, seeds, and which artifacts to keep.
  - type: textarea
    id: risks
    attributes:
      label: Limits, risks, and privacy concerns
      description: What this design would not establish even if it works, and anything sensitive it would touch.
